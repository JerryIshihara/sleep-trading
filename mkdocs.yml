site_name: Sleep Trading
site_description: Auto trading research, backtest, and live execution.
repo_url: https://github.com/JerryIshihara/sleep-trading
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tabs
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: README.md
  - Plan:
      - plan/README.md
      - Backtesting: plan/backtesting.md
      - Data: plan/data.md
      - Dashboard: plan/dashboard.md
  - Architecture:
      - Components: architecture/components.md
      - Data module: architecture/data-module.md
  - API Reference:
      - Backtesting: reference/backtesting.md
  - Research:
      - research/README.md
      - Architecture: research/architecture/survey.md
      - Backtesting: research/backtesting/survey.md
      - Backtesting — multi-engine: research/backtesting/multi-engine-survey.md
      - Case studies: research/case-studies/survey.md
      - Dashboards: research/dashboards/survey.md
      - Data sources: research/data-sources/survey.md
      - Execution & brokers: research/execution-brokers/survey.md
      - Infrastructure & deployment: research/infrastructure-deployment/survey.md
      - Monitoring & risk: research/monitoring-risk/survey.md
      - Open-source frameworks: research/open-source-frameworks/survey.md
      - Pipeline: research/pipeline/survey.md
      - Strategies: research/strategies/survey.md
